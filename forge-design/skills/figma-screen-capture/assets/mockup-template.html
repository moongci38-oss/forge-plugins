<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영툴 화면 목업 갤러리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }
  header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; color: #0f172a; }
  header .meta { font-size: 12px; color: #64748b; margin-left: auto; }
  .filter-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 24px; display: flex; gap: 0; overflow-x: auto; }
  .filter-btn { padding: 12px 16px; border: none; background: none; cursor: pointer; font-size: 14px; color: #64748b; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
  .filter-btn:hover { color: #ec4899; }
  .filter-btn.active { color: #ec4899; border-bottom-color: #ec4899; font-weight: 600; }
  .gallery { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; cursor: pointer; transition: all 0.2s; }
  .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); transform: translateY(-2px); }
  .card-img { width: 100%; height: 200px; object-fit: cover; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; }
  .card-img img { width: 100%; height: 100%; object-fit: contain; }
  .card-body { padding: 16px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 500; }
  .badge-local { background: #dcfce7; color: #15803d; }
  .badge-mcp { background: #fef9c3; color: #a16207; }
  .badge-todo { background: #fee2e2; color: #b91c1c; }
  .badge-status-review { background: #dbeafe; color: #1d4ed8; }
  .badge-status-confirmed { background: #d1fae5; color: #065f46; }
  .badge-status-issue { background: #fce7f3; color: #9d174d; }
  .card-nodeid { font-size: 11px; color: #94a3b8; font-family: monospace; }
  .card-notes { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.5; }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 40px; }
  .lightbox.open { display: flex; }
  .lightbox-inner { background: #fff; border-radius: 12px; max-width: 1200px; width: 100%; max-height: 90vh; overflow: auto; display: flex; flex-direction: column; }
  .lightbox-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .lightbox-title { font-size: 16px; font-weight: 700; }
  .lightbox-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; line-height: 1; }
  .lightbox-body { display: flex; gap: 0; flex: 1; min-height: 0; }
  .lightbox-img { flex: 1; overflow: auto; padding: 20px; background: #f8fafc; display: flex; justify-content: center; align-items: flex-start; }
  .lightbox-img img { max-width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; }
  .lightbox-info { width: 320px; border-left: 1px solid #e2e8f0; padding: 20px; overflow-y: auto; font-size: 13px; }
  .lightbox-info h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin: 16px 0 8px; }
  .lightbox-info h3:first-child { margin-top: 0; }
  .lightbox-info ul { list-style: none; }
  .lightbox-info ul li { padding: 4px 0; border-bottom: 1px solid #f1f5f9; color: #374151; }
  .lightbox-info p { color: #374151; line-height: 1.6; }
  .no-results { grid-column: 1/-1; padding: 60px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>

<header>
  <h1>📐 운영툴 화면 목업 갤러리</h1>
  <span class="meta">Figma: __FILE_KEY__ | Page: __PAGE_NODE__</span>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all" onclick="applyFilter('all', this)">전체</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-header">
      <span class="lightbox-title" id="lbTitle"></span>
      <button class="lightbox-close" onclick="closeLightbox()">×</button>
    </div>
    <div class="lightbox-body">
      <div class="lightbox-img"><img id="lbImg" src="" alt=""></div>
      <div class="lightbox-info" id="lbInfo"></div>
    </div>
  </div>
</div>

<script>
// root-cause: static mockup gallery asset — no server-side logging. console.log used for debug.
const SCREENS = __SCREENS_JSON__;
const SECTIONS = __SECTIONS_JSON__;

console.log('[gallery] loaded', SCREENS.length, 'screens,', SECTIONS.length, 'sections');

const statusBadge = (s) => {
  if (s.startsWith('✅')) return '<span class="badge badge-local">' + s + '</span>';
  if (s.startsWith('⚠️')) return '<span class="badge badge-mcp">' + s + '</span>';
  if (s.startsWith('❌')) return '<span class="badge badge-todo">' + s + '</span>';
  return '<span class="badge">' + s + '</span>';
};

const dataStatusBadge = (s) => {
  const map = { '검토중': 'review', '확정': 'confirmed', '이슈': 'issue' };
  const k = map[s] || '';
  return k ? `<span class="badge badge-status-${k}">${s}</span>` : '';
};

function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  SECTIONS.filter(Boolean).forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = sec;
    btn.textContent = sec;
    btn.onclick = () => applyFilter(sec, btn);
    bar.appendChild(btn);
  });
}

function applyFilter(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(card => {
    card.style.display = (filter === 'all' || card.dataset.section === filter) ? '' : 'none';
  });
  const gallery = document.getElementById('gallery');
  const visible = [...gallery.querySelectorAll('.card')].filter(c => c.style.display !== 'none');
  const noResults = gallery.querySelector('.no-results');
  if (noResults) noResults.remove();
  if (visible.length === 0) {
    const el = document.createElement('div');
    el.className = 'no-results';
    el.textContent = '해당 섹션의 화면이 없습니다.';
    gallery.appendChild(el);
  }
  console.log('[gallery] filter:', filter, '| visible:', visible.length);
}

function buildGallery() {
  const gallery = document.getElementById('gallery');
  SCREENS.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.section = s.section || '';
    card.onclick = () => openLightbox(idx);

    card.innerHTML = `
      <div class="card-img">
        <img src="../${s.png}" alt="${s.name}" onerror="this.parentElement.textContent='이미지 없음'">
      </div>
      <div class="card-body">
        <div class="card-title">${s.name}</div>
        <div class="card-meta">
          ${statusBadge(s.status)}
          ${s.data_status ? dataStatusBadge(s.data_status) : ''}
        </div>
        <div class="card-nodeid">${s.node_id}</div>
        ${s.notes ? `<div class="card-notes">${s.notes}</div>` : ''}
      </div>`;
    gallery.appendChild(card);
  });
  console.log('[gallery] built', SCREENS.length, 'cards');
}

function openLightbox(idx) {
  const s = SCREENS[idx];
  console.log('[gallery] open lightbox:', s.name, s.node_id);
  document.getElementById('lbTitle').textContent = s.name;
  const img = document.getElementById('lbImg');
  img.src = '../' + s.png;
  img.onerror = function() { this.alt = '이미지 없음'; };

  let info = '';
  info += '<h3>기본 정보</h3><ul>';
  info += `<li><strong>섹션</strong>: ${s.section || '—'}</li>`;
  info += `<li><strong>node-id</strong>: <code>${s.node_id}</code></li>`;
  info += `<li><strong>상태</strong>: ${s.status}</li>`;
  if (s.data_status) info += `<li><strong>검토 상태</strong>: ${s.data_status}</li>`;
  info += '</ul>';
  if (s.notes) info += `<h3>노트</h3><p>${s.notes}</p>`;
  if (s.components && s.components.length) {
    info += '<h3>컴포넌트</h3><ul>' + s.components.map(c => `<li>${c}</li>`).join('') + '</ul>';
  }
  if (s.interactions && s.interactions.length) {
    info += '<h3>인터랙션</h3><ul>' + s.interactions.map(i => `<li>${i}</li>`).join('') + '</ul>';
  }
  if (s.domain_diff && s.domain_diff.length) {
    info += '<h3>도메인별 차이</h3><ul>' + s.domain_diff.map(d => `<li>${d}</li>`).join('') + '</ul>';
  }

  document.getElementById('lbInfo').innerHTML = info;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

document.getElementById('lightbox').onclick = (e) => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

buildFilterBar();
buildGallery();
</script>
</body>
</html>
