# default-rubric.yaml — eval-rubric 스킬 축 정의
# 변경 시 supersedes 필드에 이전 버전 날짜 기재 필수
version: "1.1"
created: "2026-05-10"
updated: "2026-08-09"
supersedes: "1.0 (2026-05-10)"

# 1.1 변경 요지
#   ① 축별 레벨에 **구체 예시**(pass_example / fail_example)를 붙였다.
#      왜: 레벨 설명만으로는 경계 케이스에서 채점자(다음 세션의 나 자신 포함)가 흔들린다.
#      근거: 2026-08-04 YT 분석 hfaUTT8bLzU P0 — "레벨 정의는 있으나 concrete example 없음".
#   ② `negative_constraint` 축을 신설하되 **채점에서 제외(scored: false)** 했다.
#      왜 제외하나: 축을 평균에 넣으면 같은 산출물의 PASS/WARN/FAIL 이 즉시 이동한다.
#      그러면 "판정이 왜 움직였나"를 지표 변경과 기준 변경으로 분리할 수 없다(E-3 위반).
#      → 이번 커밋은 **지표만** 늘린다. 채점 편입은 판정 무변경을 테스트로 고정한 뒤 별도 커밋.
#   폐기조건: 예시가 실제 채점 흔들림을 줄이지 못한다는 관측이 2회 이상 쌓이면 되돌린다.

axes:
  clarity:
    description: "의도·범위·결과가 명확한가"
    scored: true
    levels:
      0: "목적·범위·기대 결과가 모두 모호하거나 서로 충돌"
      1: "일부 명확하나 중요한 부분에서 해석 여지 존재"
      2: "의도·범위·결과가 완전히 명확하여 오해 여지 없음"
    examples:
      fail: |
        "로그인 기능을 개선한다" — 무엇을 개선하는지·어디까지가 범위인지·
        무엇이 되면 끝인지가 셋 다 없다.
      warn: |
        "로그인 실패 시 에러 메시지를 개선한다. 사용자가 원인을 알 수 있게."
        — 대상은 명확하나 '원인을 알 수 있게'의 합격선이 해석에 열려 있다.
      pass: |
        "로그인 실패 시 원인별 메시지 3종(비밀번호 불일치·계정 잠김·서버 오류)을
        표시한다. 합격: 세 경우 각각 지정 문구가 화면에 뜨는 E2E 3건 통과."

  consistency:
    description: "입력 기대(spec/요구사항)와 출력이 일치하는가"
    scored: true
    levels:
      0: "출력이 입력 기대와 명백히 불일치"
      1: "주요 부분은 일치하나 일부 이탈 또는 누락 존재"
      2: "입력 기대와 출력이 전체적으로 완전히 일치"
    examples:
      fail: |
        spec 은 "읽기 전용 조회 API" 인데 산출물이 쓰기 엔드포인트를 함께 만들었다
        (요구 밖 기능 추가도 불일치다 — 부족만 불일치인 것이 아니다).
      warn: |
        spec 의 FR 5개 중 4개는 그대로인데 1개가 다른 방식으로 구현됐고
        변경 사유가 어디에도 안 적혀 있다.
      pass: |
        FR 5개가 1:1 로 대응되고, 방식을 바꾼 1개는 사유와 승인 기록이 동반된다.

  completeness:
    description: "요구사항 커버리지 — 빠진 항목 없이 모두 처리됐는가"
    scored: true
    levels:
      0: "핵심 요구사항 1개 이상 누락"
      1: "대부분 처리됐으나 일부 요구사항 미처리"
      2: "모든 요구사항 100% 커버"
    examples:
      fail: |
        "에러 처리 포함" 이 요구였는데 happy path 만 구현됐다.
      warn: |
        기능은 다 됐으나 요구에 있던 "실패 시 롤백" 이 TODO 주석으로 남아 있다.
        (코드에 TODO 가 남아 있으면 그 항목은 미처리다 — 있다고 세지 않는다.)
      pass: |
        요구 항목별 체크리스트가 전항목 ✅ 이고, 각 항목마다 확인 명령이 붙어 있다.

  safety:
    description: "보안·롤백·에러 처리가 충분한가"
    scored: true
    levels:
      0: "보안 취약, 롤백 없음, 에러 처리 부재 등 위험 요소 존재"
      1: "기본 에러 처리 존재하나 롤백 or 보안 중 일부 미흡"
      2: "보안·롤백·에러 처리 완비. 운영 환경 배포 적합"
    examples:
      fail: |
        사용자 입력을 그대로 셸 명령에 넣는다. 또는 실패 시 되돌릴 방법이 없다.
      warn: |
        try/except 는 있으나 예외를 삼키고 로그도 안 남긴다(조용한 실패).
        또는 롤백 절차가 문서에만 있고 실행해 본 적이 없다.
      pass: |
        입력 검증 + 실패 시 원장 1줄 + 되돌리기 명령이 산출물에 함께 있고,
        그 되돌리기를 한 번 실제로 돌려 본 증거가 있다.

  # ── 신설(1.1) — 채점 제외. 보고만 한다 ──────────────────────────────────────
  negative_constraint:
    description: "**명시적 금지사항**을 인지하고 지켰는가 (요구 충족과 별개 축)"
    scored: false          # ⚠️ 평균·pass_criteria 에 넣지 않는다 — E-3 참조(머리말 ②)
    report_only: true
    why: |
      기존 4축은 "요구한 것을 했는가"를 본다. 그러나 실제 사고는 반대편에서 난다 —
      **하지 말라고 한 것을 했을 때**다. 그리고 그 둘은 같이 움직이지 않는다:
      요구를 100% 충족하면서 금지사항을 어길 수 있다(예: 기능은 완벽한데 금지된
      `git stash` 를 써서 남의 미커밋을 흡수). 그래서 별도 축이어야 한다.
      근거: 2026-08-04 YT 분석 hfaUTT8bLzU — "지시를 인지하고도 위반" 패턴은
      기존 traceability 로 안 잡힌다.
    levels:
      0: "명시적 금지사항을 위반했다 (인지 여부와 무관 — 결과로 판정)"
      1: "위반은 없으나 금지사항을 인지·언급한 흔적이 없다 (우연히 안 어겼을 수 있다)"
      2: "금지사항을 명시적으로 인지하고 지켰다 — 산출물·보고에 그 근거가 있다"
    examples:
      fail: |
        브리프에 "git stash 금지" 가 있는데 산출물 로그에 stash 사용이 보인다.
        보고서에는 "정상 완료" 라고만 적혀 있다.
      warn: |
        stash 를 쓰지는 않았으나 금지사항을 읽었다는 흔적이 없다. 다른 경로를
        택한 것이 판단이었는지 우연이었는지 구분되지 않는다.
      pass: |
        보고에 "ff 가 막혀 임시 워크트리 cherry-pick 을 썼다 — stash 는 브리프
        금지사항" 이라고 적혀 있다. 인지와 준수가 같이 증명된다.
    how_to_check: |
      ① 브리프·룰에서 금지형 문장을 뽑는다(금지/하지 않는다/절대/never/must not).
      ② 각 항목에 대해 산출물·로그·보고에서 위반 흔적을 찾는다.
      ③ 위반 0건이어도, 보고에 그 금지사항을 다룬 문장이 없으면 1점이다.
      ⚠️ 이 검사가 무력화되는 입력: 금지사항이 브리프에 **암묵적으로만** 있으면
         ①에서 안 뽑힌다. 금지형은 명시 문장으로 적혀 있어야 잡힌다.

pass_criteria:
  # scored: true 인 축만 계산에 들어간다. negative_constraint 는 제외(1.1 기준).
  pass: "평균 >= 1.5 AND 모든 채점축 >= 1"
  warn: "평균 1.0~1.5 OR 1개 채점축 = 0"
  fail: "평균 < 1.0 OR 2개 이상 채점축 = 0"

report_only_policy:
  # 채점에는 안 들어가지만 침묵하지도 않는다.
  negative_constraint:
    on_level_0: "리포트 최상단에 [금지사항 위반] 배너 1줄. 판정 수치는 바꾸지 않는다."
    on_level_1: "리포트에 '금지사항 인지 흔적 없음' 1줄."
    rationale: "판정을 안 바꾸는 대신 반드시 보이게 한다 — 조용한 통과 금지."
