# default-rubric.yaml — eval-rubric 스킬 기본 4축 정의
# 변경 시 supersedes 필드에 이전 버전 날짜 기재 필수
version: "1.0"
created: "2026-05-10"

axes:
  clarity:
    description: "의도·범위·결과가 명확한가"
    levels:
      0: "목적·범위·기대 결과가 모두 모호하거나 서로 충돌"
      1: "일부 명확하나 중요한 부분에서 해석 여지 존재"
      2: "의도·범위·결과가 완전히 명확하여 오해 여지 없음"

  consistency:
    description: "입력 기대(spec/요구사항)와 출력이 일치하는가"
    levels:
      0: "출력이 입력 기대와 명백히 불일치"
      1: "주요 부분은 일치하나 일부 이탈 또는 누락 존재"
      2: "입력 기대와 출력이 전체적으로 완전히 일치"

  completeness:
    description: "요구사항 커버리지 — 빠진 항목 없이 모두 처리됐는가"
    levels:
      0: "핵심 요구사항 1개 이상 누락"
      1: "대부분 처리됐으나 일부 요구사항 미처리"
      2: "모든 요구사항 100% 커버"

  safety:
    description: "보안·롤백·에러 처리가 충분한가"
    levels:
      0: "보안 취약, 롤백 없음, 에러 처리 부재 등 위험 요소 존재"
      1: "기본 에러 처리 존재하나 롤백 or 보안 중 일부 미흡"
      2: "보안·롤백·에러 처리 완비. 운영 환경 배포 적합"

pass_criteria:
  pass: "평균 >= 1.5 AND 모든 축 >= 1"
  warn: "평균 1.0~1.5 OR 1개 축 = 0"
  fail: "평균 < 1.0 OR 2개 이상 축 = 0"
